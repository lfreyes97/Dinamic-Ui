# Copiar a ~/.config/dinamic-ui/config.toml

# Techo de expansión de la barra: notch | compact | bar | panel (default: panel).
# [bar]
# max_state = "panel"
# Recargar en caliente: dinamic-ui --reload

[theme]
# Esquema base16. Incluidos (metalelf0/base16-black-metal-scheme): black-metal, bathory,
# burzum, dark-funeral, gorgoroth, immortal, khold, marduk, mayhem, nile, venom.
# También una ruta a cualquier esquema base16 (YAML o TOML con base00..base0F).
scheme = "black-metal"
# scheme = "~/.config/dinamic-ui/gruvbox-dark.yaml"
contrast_correction = false # true: corrige texto/indicadores bajo 4,5:1 / 3:1 (WCAG)
# accent = "base0B"         # un slot (base0A…) o un hex; por defecto base0B
#
# Cambiar un slot del esquema:
# [theme.slots]
# base0B = "ddeecc"
#
# Overrides de token suelto (hex RRGGBB):
# surface = "121212"
# border = "303030"
# badge = "242424"
# text = "c1c1c1"
# muted = "999999"

[sizes]
bar_h = 32                  # 24..48
panel_h = 360               # 80..480
island_w = 260
bar_w = 640                 # se amplía sola si los workspaces no caben

[workspaces]
count = 10                  # 4..20
# Nombres que muestran los overviews (el primero es el workspace 1).
# names = ["Principal", "Desarrollo", "Navegación", "Música", "Lectura"]

[notifications]
ttl_secs = 6                # tiempo que la notificación queda en la isla

# Carpeta de imágenes de la pestaña Wallpaper (por defecto ~/Pictures/Unsplash,
# o ~/Pictures si no existe). Se aplican con `awww img`.
# [wallpapers]
# dir = "~/Pictures/Unsplash"

# Reloj mundial de la pestaña Clock (opcional; sin esta sección se muestran
# Bogotá, Madrid y Tokio). Desplazamiento fijo en horas respecto a UTC;
# dst = "eu" suma 1 h durante el horario de verano europeo.
# [[clock.cities]]
# name = "Bogotá"
# utc_offset = -5
#
# [[clock.cities]]
# name = "Madrid"
# utc_offset = 1
# dst = "eu"
#
# [[clock.cities]]
# name = "Tokio"
# utc_offset = 9

# Dock inferior con autohide: aparece al llevar el cursor al borde de abajo.
# `pinned` son comandos (o class de Hyprland); si no hay ventana abierta se lanzan.
[dock]
enabled = true
pinned = ["firefox", "code", "kitty"]


# Taskbar estilo Windows. Lados: bottom | top | left | right.
# [taskbar]
# enabled = true
# side = "bottom"
# size = 48          # grosor de la barra (40–72); los iconos se escalan con él
# autohide = false

# Topbar estilo GNOME (actividades, reloj, estado y desplegables).
# [topbar]
# enabled = true
# height = 34

# Vistas de overview: rejilla, actividades y franjas acoplables.
# [overview]
# strip_h_side = "top"     # top | bottom
# strip_v_side = "right"   # left | right
# Tamaño de las franjas: fracción de la pantalla (0.05–0.5) o píxeles enteros.
# strip_h_height = 0.2      # 1/5 del alto  (154 px en 1366×768)
# strip_v_width = 0.1667    # 1/6 del ancho (228 px en 1366×768)
