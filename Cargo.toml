[package]
name = "dinamic-ui"
version = "0.1.0"
edition = "2021"
description = "Dynamic island / bar UI for Hyprland, written in Rust from scratch"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-phosphor = { package = "egui-pop-phosphor", version = "0.15", features = ["bold"] }
egui-wgpu = "0.37"
pollster = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
toml = "0.9"
xkbcommon = "0.8"
zbus = "5"
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = { version = "0.31", features = ["system"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"] }

[profile.release]
opt-level = 2
lto = "thin"
