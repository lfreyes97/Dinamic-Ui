[package]
name = "dinamic-ui"
version = "0.1.0"
edition = "2021"
description = "Dynamic island / bar UI for Hyprland, written in Rust from scratch"

[dependencies]
chrono = { version = "0.4", features = ["clock"] }
egui = { version = "0.37", features = ["default_fonts"] }
egui-phosphor = { package = "egui-pop-phosphor", version = "0.15", features = ["bold"] }
egui-wgpu = "0.37"
pollster = "0.3"
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
smithay-client-toolkit = "0.21.1"
toml = "0.9"
xkbcommon = "0.8"
zbus = { version = "5", optional = true }
wayland-backend = { version = "0.3", features = ["client_system"] }
wayland-client = { version = "0.31", features = ["system"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp"], optional = true }
freedesktop-icons = { version = "0.4.0", optional = true }
png = { version = "0.18.1", optional = true }

[profile.release]
opt-level = 2
lto = "thin"

# Componentes compilables por separado. Ver docs/MODULARIZATION_PLAN.md.
[features]
default = ["bar", "dock", "taskbar", "topbar", "overview", "activities", "command-menu", "notifications", "wallpaper"]
# Isla / píldora / barra / panel (un solo componente con estados de expansión).
bar = []
# Topbar GNOME-like: reloj, estado y desplegables.
topbar = ["bar"]
# Iconos reales de app (tema freedesktop, solo PNG). La activan sus consumidores.
icons = ["dep:freedesktop-icons", "dep:png"]
dock = ["icons"]
# Otra vista sobre el modelo del dock (reservada: aún sin implementar).
taskbar = ["dock"]
# Overview de workspaces: rejilla de pantalla completa y franjas acoplables.
overview = ["icons"]
# Actividades: lanzador a pantalla completa (apps instaladas + ventanas). No es un overview de
# workspaces: se parece al modo «Apps» del command menu y no depende del overview.
activities = ["icons"]
command-menu = ["icons"]
# Servidor org.freedesktop.Notifications (zbus) y su tarjeta.
notifications = ["dep:zbus"]
# Pestaña Wallpaper del panel (vive en el panel, de ahí `bar`) y sus miniaturas.
wallpaper = ["bar", "dep:image"]

[dev-dependencies]
# Renderiza la UI a PNG sin compositor (`cargo test ui_preview -- --ignored`).
egui_kittest = { version = "0.37", features = ["wgpu"] }
