-- Fragmento para ~/.config/hypr/hyprland.lua (sintaxis Lua de Hyprland).
-- Ajusta la ruta al binario.

local DINAMIC_UI = "/home/luis/Projects/Dinamic-Ui/target/release/dinamic-ui"

hl.on("hyprland.start", function()
    hl.exec_cmd("awww-daemon") -- fondos (pestaña Wallpaper); omitir si ya lo arrancas en otro sitio
    hl.exec_cmd(DINAMIC_UI)
end)

-- Control sin depender del foco del layer (socket de control).
hl.bind("SUPER, I",        hl.dsp.exec_cmd(DINAMIC_UI .. " --toggle"))
hl.bind("SUPER SHIFT, I",  hl.dsp.exec_cmd(DINAMIC_UI .. " --panel"))
hl.bind("SUPER ESCAPE",    hl.dsp.exec_cmd(DINAMIC_UI .. " --collapse"))
hl.bind("SUPER ALT, I",    hl.dsp.exec_cmd(DINAMIC_UI .. " --reload"))
hl.bind("SUPER CTRL, I",   hl.dsp.exec_cmd(DINAMIC_UI .. " --quit"))

-- El surface se llama "dinamic-ui" (namespace del layer shell).
hl.layer_rule({
    name  = "no-anim-dinamic-ui",
    match = { namespace = "^dinamic-ui$" },
    no_anim = true,
})
